[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
todo = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
map_err_ignore = "warn"
missing_errors_doc = "allow"
redundant_pub_crate = "warn"
arbitrary_source_item_ordering = "deny"

[workspace.dependencies]
age = { version = "0.12.1", default-features = false }
age-core = { version = "0.12.0", default-features = false }
base64 = { version = "0.22", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
clap = { version = "4.6", default-features = false }
dialoguer = { version = "0.12", default-features = false }
hkdf = { version = "0.12", default-features = false }
rand = { version = "0.8", default-features = false }
rpassword = { version = "7.5", default-features = false }
serde = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
sha2 = { version = "0.10", default-features = false }
ssh-key = { version = "0.6", default-features = false }
thiserror = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false }
