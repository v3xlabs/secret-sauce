[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
todo = "warn"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
map_err_ignore = "warn"
missing_errors_doc = "allow"
redundant_pub_crate = "warn"
arbitrary_source_item_ordering = "deny"
