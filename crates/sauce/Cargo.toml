[package]
name = "sauce"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
age = { workspace = true }
age-core = { workspace = true }
base64 = { workspace = true, features = ["alloc"] }
chacha20poly1305 = { workspace = true, features = ["alloc"] }
clap = { workspace = true, features = ["derive", "env", "error-context", "help", "std", "usage"] }
dialoguer = { workspace = true, features = ["fuzzy-select"] }
hkdf = { workspace = true }
rand = { workspace = true, features = ["getrandom"] }
rpassword = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
ssh-key = { workspace = true, features = ["alloc", "ed25519"] }
thiserror = { workspace = true }
zeroize = { workspace = true, features = ["alloc"] }
